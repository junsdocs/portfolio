<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img"><title>Pipedrive 활동 생성 자동화</title><desc>개선 전후 업무 흐름도</desc><rect width="1100" height="570" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="36" y="87" font-size="31" fill="#183c40" font-weight="700">Pipedrive 활동 생성 자동화</text><text x="36" y="148" font-size="20" fill="#6b7880" font-weight="700">개선 전</text><rect x="155" y="122" width="200" height="92" rx="9" fill="#f2f4f6" stroke="#6b7880" stroke-opacity=".3"/><text x="171" y="157" font-size="21" fill="#6b7880" font-weight="700">대상 확인</text><text x="171" y="190" font-size="16" fill="#475d68" font-weight="400">처리할 고객 건 확인</text><path d="M 362 168 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#6b7880" stroke-width="2"/><rect x="385" y="122" width="200" height="92" rx="9" fill="#f2f4f6" stroke="#6b7880" stroke-opacity=".3"/><text x="401" y="157" font-size="21" fill="#6b7880" font-weight="700">화면에 값 입력</text><text x="401" y="190" font-size="16" fill="#475d68" font-weight="400">활동마다 개별 입력</text><path d="M 592 168 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#6b7880" stroke-width="2"/><rect x="615" y="122" width="200" height="92" rx="9" fill="#f2f4f6" stroke="#6b7880" stroke-opacity=".3"/><text x="631" y="157" font-size="21" fill="#6b7880" font-weight="700">활동 생성</text><text x="631" y="190" font-size="16" fill="#475d68" font-weight="400">건별 저장·생성</text><path d="M 822 168 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#6b7880" stroke-width="2"/><rect x="845" y="122" width="200" height="92" rx="9" fill="#f2f4f6" stroke="#6b7880" stroke-opacity=".3"/><text x="861" y="157" font-size="21" fill="#6b7880" font-weight="700">다음 건 반복</text><text x="861" y="190" font-size="16" fill="#475d68" font-weight="400">건당 30초~1분</text><text x="36" y="293" font-size="20" fill="#13776e" font-weight="700">개선 후</text><rect x="155" y="267" width="200" height="92" rx="9" fill="#edf6f3" stroke="#13776e" stroke-opacity=".3"/><text x="171" y="302" font-size="21" fill="#13776e" font-weight="700">대상 추출</text><text x="171" y="335" font-size="16" fill="#475d68" font-weight="400">처리 대상 준비</text><path d="M 362 313 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#13776e" stroke-width="2"/><rect x="385" y="267" width="200" height="92" rx="9" fill="#edf6f3" stroke="#13776e" stroke-opacity=".3"/><text x="401" y="302" font-size="21" fill="#13776e" font-weight="700">엑셀 값 정리</text><text x="401" y="335" font-size="16" fill="#475d68" font-weight="400">건별 입력값 작성</text><path d="M 592 313 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#13776e" stroke-width="2"/><rect x="615" y="267" width="200" height="92" rx="9" fill="#edf6f3" stroke="#13776e" stroke-opacity=".3"/><text x="631" y="302" font-size="21" fill="#13776e" font-weight="700">API 일괄 생성</text><text x="631" y="335" font-size="16" fill="#475d68" font-weight="400">반복 입력 자동화</text><path d="M 822 313 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#13776e" stroke-width="2"/><rect x="845" y="267" width="200" height="92" rx="9" fill="#edf6f3" stroke="#13776e" stroke-opacity=".3"/><text x="861" y="302" font-size="21" fill="#13776e" font-weight="700">팀 정기 업무 적용</text><text x="861" y="335" font-size="16" fill="#475d68" font-weight="400">주 1회 약 200건</text><rect x="36" y="407" width="1028" height="70" rx="8" fill="#183c40"/><text x="55" y="436" font-size="21" fill="white" font-weight="700">주 200건의 반복 입력 축소 → CX·고객성공에 집중할 여력 확보</text><text x="55" y="461" font-size="16" fill="#cce4dc" font-weight="400">기획·설계·구현·운영: 양준호</text><text x="36" y="510" font-size="16" fill="#52666e" font-weight="400">100~200분은 기존 주간 수작업 환산치이며, 준비·실행·확인 후 순절감 시간은 미계측입니다.</text></g></svg>