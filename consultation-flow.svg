<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img"><title>상담 안내문 자동 생성</title><desc>실제 화면과 내부 식별자를 포함하지 않은 개선 전후 업무 흐름도</desc><rect width="1100" height="570" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="36" y="40" font-size="15" fill="#64767d" font-weight="400">업무 흐름 재구성</text><text x="36" y="87" font-size="31" fill="#183c40" font-weight="700">상담 안내문 자동 생성</text><text x="36" y="148" font-size="20" fill="#6b7880" font-weight="700">개선 전</text><rect x="155" y="122" width="200" height="92" rx="9" fill="#f2f4f6" stroke="#6b7880" stroke-opacity=".3"/><text x="171" y="157" font-size="21" fill="#6b7880" font-weight="700">여러 시스템 조회</text><text x="171" y="190" font-size="16" fill="#475d68" font-weight="400">고객별 정보 확인</text><path d="M 362 168 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#6b7880" stroke-width="2"/><rect x="385" y="122" width="200" height="92" rx="9" fill="#f2f4f6" stroke="#6b7880" stroke-opacity=".3"/><text x="401" y="157" font-size="21" fill="#6b7880" font-weight="700">값 복사</text><text x="401" y="190" font-size="16" fill="#475d68" font-weight="400">금액·계좌·날짜 등</text><path d="M 592 168 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#6b7880" stroke-width="2"/><rect x="615" y="122" width="200" height="92" rx="9" fill="#f2f4f6" stroke="#6b7880" stroke-opacity=".3"/><text x="631" y="157" font-size="21" fill="#6b7880" font-weight="700">안내문 조립</text><text x="631" y="190" font-size="16" fill="#475d68" font-weight="400">템플릿에 수동 반영</text><path d="M 822 168 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#6b7880" stroke-width="2"/><rect x="845" y="122" width="200" height="92" rx="9" fill="#f2f4f6" stroke="#6b7880" stroke-opacity=".3"/><text x="861" y="157" font-size="21" fill="#6b7880" font-weight="700">확인 후 발송</text><text x="861" y="190" font-size="16" fill="#475d68" font-weight="400">담당자 최종 확인</text><text x="36" y="293" font-size="20" fill="#13776e" font-weight="700">개선 후</text><rect x="155" y="267" width="200" height="92" rx="9" fill="#edf6f3" stroke="#13776e" stroke-opacity=".3"/><text x="171" y="302" font-size="21" fill="#13776e" font-weight="700">고객 건 입력</text><text x="171" y="335" font-size="16" fill="#475d68" font-weight="400">담당자가 대상 지정</text><path d="M 362 313 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#13776e" stroke-width="2"/><rect x="385" y="267" width="200" height="92" rx="9" fill="#edf6f3" stroke="#13776e" stroke-opacity=".3"/><text x="401" y="302" font-size="21" fill="#13776e" font-weight="700">시스템 값 조회</text><text x="401" y="335" font-size="16" fill="#475d68" font-weight="400">약 30종 값 연결</text><path d="M 592 313 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#13776e" stroke-width="2"/><rect x="615" y="267" width="200" height="92" rx="9" fill="#edf6f3" stroke="#13776e" stroke-opacity=".3"/><text x="631" y="302" font-size="21" fill="#13776e" font-weight="700">안내문 자동 생성</text><text x="631" y="335" font-size="16" fill="#475d68" font-weight="400">템플릿에 값 반영</text><path d="M 822 313 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#13776e" stroke-width="2"/><rect x="845" y="267" width="200" height="92" rx="9" fill="#edf6f3" stroke="#13776e" stroke-opacity=".3"/><text x="861" y="302" font-size="21" fill="#13776e" font-weight="700">확인 후 발송</text><text x="861" y="335" font-size="16" fill="#475d68" font-weight="400">담당자 최종 확인</text><rect x="36" y="407" width="1028" height="70" rx="8" fill="#183c40"/><text x="55" y="436" font-size="21" fill="white" font-weight="700">CX팀 전원(4명)이 고객 문의 대응에 사용 · 메시지당 작성 시간 1분 이상 단축</text><text x="55" y="461" font-size="16" fill="#cce4dc" font-weight="400">기획·설계·구현·운영: 양준호</text><text x="36" y="510" font-size="16" fill="#52666e" font-weight="400">시간 단축은 사용 경험 기준입니다. 고객 대상을 잘못 입력하는 오류는 남아 있어 확인이 필요합니다.</text><text x="36" y="541" font-size="14" fill="#74838a" font-weight="400">기능 설명용 재구성 · 고객 정보 및 내부 주소 미포함</text></g></svg>